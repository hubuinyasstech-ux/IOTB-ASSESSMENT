<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Header</title>
    <link rel="stylesheet" href="instagram.css" />
</head>

<body>

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">
            <i class="fa-brands fa-instagram"></i>
            <span>Instagram</span>
        </div>

        <!-- Desktop Navigation -->
        <nav class="nav-links">
            <a href="#"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
            <a href="#"><i class="fa-regular fa-compass"></i> Explore</a>
            <a href="#"><i class="fa-solid fa-clapperboard"></i> Reels</a>
            <a href="#"><i class="fa-regular fa-paper-plane"></i> Messages</a>
            <a href="#"><i class="fa-regular fa-heart"></i> Notifications</a>
            <a href="#"><i class="fa-regular fa-square-plus"></i> Create</a>
            <a href="#"><i class="fa-regular fa-circle-user"></i> Profile</a>
        </nav>

        <!-- Hamburger -->
        <div class="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>

    </header>

</body>

</html>
