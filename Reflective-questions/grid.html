<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magazine Grid Layout</title>
    <link rel="stylesheet" href="grid.css" />
</head>

<body>

    <div class="magazine">

        <article class="card hero">
            <h1>Hero Article</h1>
            <p>Main featured story spanning full width.</p>
        </article>

        <article class="card secondary">
            <h2>Secondary Article 1</h2>
        </article>

        <article class="card secondary">
            <h2>Secondary Article 2</h2>
        </article>

        <article class="card wide">
            <h2>Wide Bottom Article</h2>
        </article>

        <article class="card small">
            <h3>Small Article 1</h3>
        </article>

        <article class="card small">
            <h3>Small Article 2</h3>
        </article>

        <article class="card small">
            <h3>Small Article 3</h3>
        </article>

    </div>

</body>

</html>
