<div class="grid gap-6 md:grid-cols-3 p-8 bg-gray-100 min-h-screen">

    <!-- DEFAULT CARD -->
    <article class="
      bg-white
      rounded-2xl
      border border-gray-200
      p-6
      shadow-sm
      transition-all
      duration-300
    ">
        <h2 class="text-xl font-semibold mb-3">
            Default Card
        </h2>

        <p class="text-gray-600">
            Standard card appearance with subtle styling.
        </p>
    </article>


    <!-- HOVER CARD -->
    <article class="
      bg-white
      rounded-2xl
      border border-gray-200
      p-6
      shadow-sm

      transition-all
      duration-300

      hover:-translate-y-2
      hover:shadow-xl
    ">
        <h2 class="text-xl font-semibold mb-3">
            Hover Card
        </h2>

        <p class="text-gray-600">
            This card lifts upward and gains a stronger shadow.
        </p>
    </article>


    <!-- FEATURED CARD -->
    <article class="
      bg-white
      rounded-2xl

      border-2 border-blue-500

      p-8

      shadow-lg

      scale-[1.02]

      transition-all
      duration-300

      hover:-translate-y-2
      hover:shadow-2xl
    ">

        <span class="
        inline-block
        mb-4
        px-3 py-1
        text-sm
        font-medium
        rounded-full
        bg-blue-100
        text-blue-700
      ">
            Featured
        </span>

        <h2 class="text-2xl font-bold mb-4">
            Featured Card
        </h2>

        <p class="text-gray-600">
            Larger spacing, highlighted border, and stronger emphasis.
        </p>
    </article>

</div>
