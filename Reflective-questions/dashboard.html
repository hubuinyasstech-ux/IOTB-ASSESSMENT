<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Dashboard</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Features</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="main">
            <h1>Main Content</h1>

            <div class="cards">
                <div class="card">Revenue</div>
                <div class="card">Users</div>
                <div class="card">Sales</div>
                <div class="card">Performance</div>
            </div>
        </main>

        <aside class="right-panel">
            <h2>Notifications</h2>

            <div class="notification">Server updated</div>
            <div class="notification">New signup</div>
            <div class="notification">Payment received</div>
        </aside>

    </div>

</body>

</html>
